function openSearch(){
  openSheet(`<h2>Buscar cliente</h2><input id="q" type="search" placeholder="Código, nombre o dirección" autocomplete="off"><ul class="list" id="qres"></ul>`);
  sheetBody.onclick = e=>{ const li=e.target.closest('li[data-id]'); if(!li) return; const c=S.clients.find(x=>x.id===li.dataset.id); if(c&&located(c)) map.setView([c.lat,c.lng],16); openClient(li.dataset.id); };
  const q = document.getElementById('q'), out = document.getElementById('qres');
  const run = ()=>{ const t=norm(q.value); if(!t){ out.innerHTML=''; return; }
    const res = S.clients.filter(c=>norm(codeOf(c)+' '+c.nombre+' '+c.direccion).includes(t)).slice(0,30);
    out.innerHTML = res.length ? res.map(c=>`<li data-id="${c.id}" style="--c:${c.baja?'#9aa7ab':zoneColor(c.zona)}"><span class="num">${c.baja?'×':isVisited(c)?'✓':c.zona!=null?c.zona+1:'?'}</span><span class="txt"><b><span class="code">${esc(codeOf(c))}</span>${esc(c.nombre)}</b><small>${esc(c.direccion)}</small></span></li>`).join('') : '<li><span class="txt"><small>Sin resultados</small></span></li>';
  };
  q.addEventListener('input', run); setTimeout(()=>q.focus(),250);
}
document.getElementById('btnSearch').onclick = openSearch;

/* ============ Ubicación en tiempo real ============ */
let watchId=null, follow=false, accCircle=null;
const meBtn = document.getElementById('btnMe');
function refreshRouteStart(){ UI.routeFrom = UI.me ? {lat:UI.me.lat, lng:UI.me.lng} : null; }
function kmTo(c){
  const R=6371, r=Math.PI/180, dLa=(c.lat-UI.me.lat)*r, dLo=(c.lng-UI.me.lng)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(UI.me.lat*r)*Math.cos(c.lat*r)*Math.sin(dLo/2)**2;
  const km=2*R*Math.asin(Math.sqrt(a));
  return km<1 ? Math.round(km*1000/50)*50+' m' : km.toFixed(1).replace('.',',')+' km';
}
function updateMeBtn(){
  meBtn.classList.toggle('on', watchId!=null && follow);
  meBtn.classList.toggle('track', watchId!=null && !follow);
  meBtn.setAttribute('aria-label', watchId==null ? 'Activar mi ubicación' : follow ? 'Siguiendo tu ubicación' : 'Centrar en mi ubicación');
}
function onPos(p){
  const first = !UI.me;
  UI.me = {lat:p.coords.latitude, lng:p.coords.longitude};
  const ll = [UI.me.lat, UI.me.lng], acc = Math.min(p.coords.accuracy||30, 500);
  if(!meMarker) meMarker = L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:3000}).addTo(map);
  else meMarker.setLatLng(ll);
  if(!accCircle) accCircle = L.circle(ll,{radius:acc,weight:1,color:'#2563eb',fillColor:'#2563eb',fillOpacity:.08,interactive:false}).addTo(map);
  else { accCircle.setLatLng(ll); accCircle.setRadius(acc); }
  if(follow) map.setView(ll, first ? Math.max(map.getZoom(),16) : map.getZoom(), {animate:true});
  if(first){ refreshRouteStart(); if(UI.zone!=='all') render(); }
}
function onPosErr(err){
  if(err.code===1){ stopTracking(); toast('Permiso de ubicación denegado. Habilitalo en la configuración del navegador.'); }
  else if(!UI.me) toast('Buscando señal de ubicación…');
}
function startTracking(centrar){
  if(!navigator.geolocation){ toast('Tu navegador no permite ubicación'); return; }
  follow = !!centrar;
  if(watchId==null){
    watchId = navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
    S.track = true; save();
  } else if(UI.me && centrar) map.setView([UI.me.lat,UI.me.lng], Math.max(map.getZoom(),16));
  updateMeBtn();
}
function stopTracking(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId);
  watchId=null; follow=false; UI.me=null; UI.routeFrom=null; S.track=false; save();
  if(meMarker){ meMarker.remove(); meMarker=null; }
  if(accCircle){ accCircle.remove(); accCircle=null; }
  updateMeBtn(); render();
}
meBtn.onclick = ()=> startTracking(true);
map.on('dragstart', ()=>{ if(follow){ follow=false; updateMeBtn(); } });

/* ============ Avisos ============ */
let toastT;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display='none',2400); }
function showBanner(text,btn,fn){ const b=document.getElementById('banner'); document.getElementById('bannerTxt').textContent=text; const bb=document.getElementById('bannerBtn'); bb.textContent=btn; bb.onclick=fn; b.style.display='flex'; document.getElementById('fabs').style.display='none'; }
function hideBanner(){ document.getElementById('banner').style.display='none'; document.getElementById('fabs').style.display='flex'; }

/* ============ Inicio ============ */
load();
render();
if(S.track) startTracking(false);
setTimeout(()=>autoSync(true), 400);
if(S.clients.some(located)) fitZone();
if(!S.clients.length) openEmpty();
else checkPending();
</script>
